<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDP Mobile Sticky Marketplace Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #f4f6f5;
      margin: 0;
      padding: 20px 10px;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
    }

    /* iPhone Frame */
    .mobile-screen {
      width: 375px;
      height: 680px;
      background: #ffffff;
      border-radius: 38px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2), 0 0 0 10px #1a202c;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .device-notch {
      width: 140px;
      height: 24px;
      background: #1a202c;
      margin: 0 auto;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      flex-shrink: 0;
    }

    .pdp-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 95px;
    }

    .product-title {
      font-size: 20px;
      font-weight: 700;
      color: #173E34;
      margin: 0 0 8px;
    }
    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #285044;
      margin-bottom: 14px;
    }

    /* Simulated original place */
    .original-marketplace-place {
      padding: 10px 0;
    }

    .select-size-header {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 14px;
      margin-bottom: 8px;
      color: #111;
    }

    .size-pills {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .size-pill {
      padding: 8px 16px;
      border: 1px solid #173E34;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #EEF3EF;
      color: #173E34;
    }

    /* Sticky Purchase Action Bar Styles */
    .mobile-sticky-action-bar {
      display: block;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid #E2E6DF;
      padding: 8px 14px 10px;
      z-index: 999;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    .mobile-sticky-inner {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn-sticky-action {
      flex: 1;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 22px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      padding: 0 10px;
      letter-spacing: 0.02em;
    }

    .btn-sticky-action.add-cart-sticky {
      background-color: #285044;
      color: #ffffff;
    }

    .btn-sticky-action.buy-now-sticky {
      background-color: #D96C3F;
      color: #ffffff;
    }

    /* Sticky Marketplace Row - Smaller/sleeker size on mobile */
    .mobile-sticky-marketplace {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 7px;
    }

    .ayova-marketplace-bar--sticky {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    .ayova-marketplace-bar--sticky .ayova-marketplace-label {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #285044;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ayova-marketplace-bar--sticky .ayova-marketplace-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ayova-marketplace-bar--sticky .ayova-marketplace-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 4px 14px;
      background: #FFFFFF;
      border: 1.5px solid #D6DED9;
      border-radius: 9px;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .ayova-marketplace-bar--sticky .ayova-marketplace-btn.ayova-mkt-amazon {
      border-color: #FF9900;
      background: #FFFDF8;
    }

    .ayova-marketplace-bar--sticky .ayova-marketplace-btn.ayova-mkt-flipkart {
      border-color: #2874F0;
      background: #F8FBFF;
    }

    .ayova-marketplace-bar--sticky .ayova-mkt-logo {
      height: 20px;
      width: auto;
      max-width: 75px;
      object-fit: contain;
      display: block;
    }

    /* Hide the original in-page marketplace bar on mobile */
    .ayova-marketplace-bar--pdp {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="mobile-screen">
    <div class="device-notch"></div>

    <div class="pdp-scroll-area">
      <h1 class="product-title">Ayova Liver Care Syrup</h1>
      <div class="product-price">Rs. 389.00</div>

      <!-- In original place: Hidden on mobile! -->
      <div class="original-marketplace-place">
        <div class="ayova-marketplace-bar ayova-marketplace-bar--pdp">
          <span class="ayova-marketplace-label">Buy now</span>
          <div class="ayova-marketplace-links">
            <a href="#" class="ayova-marketplace-btn"><img src="assets/amazon.svg" alt="Amazon" class="ayova-mkt-logo"></a>
            <a href="#" class="ayova-marketplace-btn"><img src="assets/flipkart_wvl.svg" alt="Flipkart" class="ayova-mkt-logo"></a>
          </div>
        </div>
      </div>

      <div class="select-size-header">SELECT SIZE</div>
      <div class="size-pills">
        <div class="size-pill">200ml Bottle</div>
        <div class="size-pill" style="opacity: 0.6; border-color: #ccc; background: #fff;">450ml Pack</div>
      </div>

      <p style="font-size: 13px; line-height: 1.6; color: #555;">
        Crafted with classical herbs like Milk Thistle, Bhumi Amla, and Kalmegh for comprehensive liver vitality, toxin flushing, and optimal digestion support.
      </p>

      <div style="height: 200px; background: #f0f3f1; border-radius: 12px; margin-top: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">
        Product details content...
      </div>
    </div>

    <!-- Floating Product Video -->
    <div class="floating-product-video minimized" id="floatingProductVideo" style="position: absolute; bottom: 115px; left: 14px; width: 65px; height: 65px; border-radius: 50%; z-index: 1000; box-shadow: 0 4px 14px rgba(0,0,0,0.3); background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <div style="color: #fff; font-size: 10px; font-weight: 600; text-align: center;">Video</div>
    </div>

    <!-- Sticky Bottom Action Bar with both Add to Cart / Buy Now + Marketplace buttons -->
    <div class="mobile-sticky-action-bar">
      <div class="mobile-sticky-inner">
        <button type="button" class="btn-sticky-action add-cart-sticky">
          ADD TO CART
        </button>
        <button type="button" class="btn-sticky-action buy-now-sticky">
          BUY NOW
        </button>
      </div>

      <div class="mobile-sticky-marketplace">
        <div class="ayova-marketplace-bar ayova-marketplace-bar--sticky">
          <span class="ayova-marketplace-label">Buy now</span>
          <div class="ayova-marketplace-links">
            <a href="#" class="ayova-marketplace-btn ayova-mkt-amazon">
              <img src="assets/amazon.svg" alt="Amazon" class="ayova-mkt-logo">
            </a>
            <a href="#" class="ayova-marketplace-btn ayova-mkt-flipkart">
              <img src="assets/flipkart_wvl.svg" alt="Flipkart" class="ayova-mkt-logo">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
